<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
</head>

<body>
    <div style="" class="py-3">
  <h2 class="sr-only text-center text-uppercase mb-6">khởi động trại hè 2026</h2>

  <div class="d-flex flex-wrap justify-content-around gap-4 mt-6">
    <div class="d-flex flex-column align-items-center gap-2">
      <div class="wheel-label text-uppercase display-6">Đội trưởng<span class="pending-dot" id="dot1"></span></div>
      <svg id="chart1"></svg>
      <span class="badge bg-secondary" id="progress1">0 / 10</span>
      <div class="spin-hint text-center" id="hint1"></div>
      <div class="question-box text-center px-2" id="question1"></div>
    </div>
    <div class="d-flex flex-column align-items-center gap-2">
      <div class="wheel-label text-uppercase display-6  ">Huynh trưởng<span class="pending-dot" id="dot2"></span></div>
      <svg id="chart2"></svg>
      <span class="badge bg-secondary" id="progress2">0 / 10</span>
      <div class="spin-hint text-center" id="hint2"></div>
      <div class="question-box text-center px-2" id="question2"></div>
    </div>
  </div>

  <div id="modal-overlay">
    <canvas id="confetti-canvas"></canvas>
    <div id="modal-box modal-xl" class="card shadow-sm border-0">
      <div class="card-body text-center p-4">
        <div style="font-size:40px;" class="mb-2">🎉</div>
        <h5 class="card-title fw-semibold mb-3">Chúc mừng toàn đội và Huynh trưởng!</h5>
        <div class="d-flex flex-column gap-2 mb-4">
          <div class="d-flex align-items-center gap-2 p-2 rounded border">
            <span class="badge bg-primary">Đội trưởng</span>
            <span class="fw-medium" id="modal-label1">—</span>
          </div>
          <div class="d-flex align-items-center gap-2 p-2 rounded border">
            <span class="badge bg-success">Huynh trưởng</span>
            <span class="fw-medium" id="modal-label2">—</span>
          </div>
        </div>
        <button id="modal-close" class="btn btn-outline-secondary btn-sm px-4">Đóng</button>
      </div>
    </div>
  </div>
</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/3.5.17/d3.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/js/script.js"></script>
</body>

</html>
